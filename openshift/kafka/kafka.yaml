---
# openshift/kafka/kafka-cluster.yaml
#
# Kafka cluster deployed via the Strimzi Operator (Red Hat AMQ Streams).
#
# Prerequisites:
#   1. Install Strimzi / AMQ Streams Operator from OperatorHub in OpenShift.
#   2. Wait for the operator pod to be Running in the operator namespace.
#   3. Then apply this manifest.
#
# To install operator:
#   oc apply -f https://strimzi.io/install/latest?namespace=payment-system -n payment-system
#
# Strimzi creates a Kafka cluster and automatically provisions:
#   - Zookeeper StatefulSet
#   - Kafka broker StatefulSet
#   - Internal Services (bootstrap, broker-specific)
#   - TLS certificates (optional)
#
# Bootstrap service DNS (used in ConfigMap):
#   payment-kafka-kafka-bootstrap.payment-system.svc:9092

apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: payment-kafka
  namespace: payment-system
  labels:
    app: payment-kafka
spec:
  kafka:
    version: 3.6.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor:         "3"
      transaction.state.log.replication.factor: "3"
      transaction.state.log.min.isr:            "2"
      default.replication.factor:               "3"
      min.insync.replicas:                       "2"
      inter.broker.protocol.version:             "3.6"
      log.retention.hours:                       "168"    # 7 days
      log.segment.bytes:                         "1073741824"
    resources:
      requests:
        cpu:    "500m"
        memory: "1Gi"
      limits:
        cpu:    "2000m"
        memory: "4Gi"
    storage:
      type: persistent-claim
      size: 50Gi
      deleteClaim: false
      # storageClass: your-storage-class
  zookeeper:
    replicas: 3
    resources:
      requests:
        cpu:    "250m"
        memory: "512Mi"
      limits:
        cpu:    "500m"
        memory: "1Gi"
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}

---
# openshift/kafka/kafka-topics.yaml
#
# KafkaTopic resources — managed by Strimzi's Entity Operator.
# Strimzi reconciles these into actual Kafka topics automatically.

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: payment-fraud-request
  namespace: payment-system
  labels:
    strimzi.io/cluster: payment-kafka
spec:
  partitions: 3
  replicas:   3
  config:
    retention.ms:    "604800000"    # 7 days
    cleanup.policy:  "delete"
    min.insync.replicas: "2"

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: payment-fraud-response
  namespace: payment-system
  labels:
    strimzi.io/cluster: payment-kafka
spec:
  partitions: 3
  replicas:   3
  config:
    retention.ms:    "604800000"
    cleanup.policy:  "delete"
    min.insync.replicas: "2"

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: payment-events
  namespace: payment-system
  labels:
    strimzi.io/cluster: payment-kafka
spec:
  partitions: 6
  replicas:   3
  config:
    retention.ms:    "2592000000"   # 30 days — keep events longer for audit
    cleanup.policy:  "delete"
    min.insync.replicas: "2"
