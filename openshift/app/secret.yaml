---
# openshift/app/secret.yaml
#
# Stores sensitive credentials. Values must be base64-encoded.
#
# To encode:
#   echo -n "payment_user" | base64    → cGF5bWVudF91c2Vy
#   echo -n "payment_pass" | base64    → cGF5bWVudF9wYXNz
#
# To create in OpenShift:
#   oc apply -f openshift/app/secret.yaml -n payment-system
#
# To update a value:
#   oc create secret generic payment-workflow-secrets \
#     --from-literal=DB_USERNAME=payment_user \
#     --from-literal=DB_PASSWORD=payment_pass \
#     --dry-run=client -o yaml | oc apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: payment-workflow-secrets
  namespace: payment-system
  labels:
    app: payment-workflow
type: Opaque
data:
  # echo -n "payment_user" | base64
  DB_USERNAME: cGF5bWVudF91c2Vy
  # echo -n "payment_pass" | base64
  DB_PASSWORD: cGF5bWVudF9wYXNz
  # echo -n "jdbc:postgresql://payment-postgres:5432/paymentdb" | base64
  DB_URL: amRiYzpwb3N0Z3Jlc3FsOi8vcGF5bWVudC1wb3N0Z3JlczoU0NDMycGF5bWVudGRi
